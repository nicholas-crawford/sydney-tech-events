name: Ingest and deploy

on:
  # Weekly: Monday ~6am Sydney (Sunday 19:00 UTC; 7am during AEST).
  schedule:
    - cron: "0 19 * * 0"
  # Manual run from the Actions tab (e.g. right before a demo).
  workflow_dispatch:
  # Redeploy the page when code changes.
  push:
    branches: [main]

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Scrape on the self-hosted Mac runner: Eventbrite blocks datacenter IPs (HTTP 405
  # from GitHub-hosted runners), a residential IP is fine. Never runs on push, so
  # code changes can't reach the Mac; only schedule/manual runs from this repo do.
  ingest:
    if: github.event_name != 'push'
    runs-on: [self-hosted, sydney-ingest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: Ingest events
        run: vpx ./scripts/ingest.ts

      # Git scraping: commit the data so history shows what changed each week.
      # Commits made with GITHUB_TOKEN don't trigger another push run, so no loop.
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/events.json public/events.csv public/summary.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit --no-verify -m "data: weekly ingest $(date -u +%F)"
            git push
          fi

  # Build + deploy on GitHub-hosted runners. Runs even if ingest was skipped (push)
  # or failed (Mac asleep/offline), deploying whatever data is on main.
  build:
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # ref: main, not the triggering SHA, so a fresh ingest commit is included.
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - run: vp run build

      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
