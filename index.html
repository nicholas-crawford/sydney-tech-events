<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Every Sydney tech event in one list, deduplicated across sources."
    />
    <title>Sydney Tech Events</title>
  </head>
  <body>
    <header class="site-header">
      <h1>Sydney Tech Events</h1>
      <p id="summary" aria-live="polite">Loading events…</p>
      <p><a id="csv" href="events.csv" download>Download CSV</a></p>
    </header>

    <main>
      <ol id="days" class="days" aria-busy="true"></ol>
    </main>

    <template id="day-template">
      <li class="day">
        <h2><time></time></h2>
        <ol class="events"></ol>
      </li>
    </template>

    <template id="event-template">
      <li>
        <article class="event">
          <h3><a class="event-title"></a></h3>
          <p class="event-meta">
            <time class="event-time"></time><span class="event-venue"></span>
          </p>
          <ul class="sources" aria-label="Listed on"></ul>
        </article>
      </li>
    </template>

    <template id="source-template">
      <li>
        <a class="source">
          <svg class="source-icon" aria-hidden="true" viewBox="0 0 16 16" width="12" height="12">
            <path
              d="M6 3H3v10h10v-3M9 2h5v5M14 2 7 9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            />
          </svg>
          <span class="source-name"></span>
        </a>
      </li>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
